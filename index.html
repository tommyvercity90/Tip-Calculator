
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <h1>Tip Calculator</h1>
        <p class="subtitle">Split the bill with ease!</p>

        <div class="input-group">
            <label for="bill">Bill Amount (₹)</label>
            <input type="number" id="bill" placeholder="Enter bill amount" min="0" step="0.01">
        </div>

        <div class="input-group">
            <label>Select Tip Percentage</label>
            <div class="tip-buttons">
                <button type="button" class="tip-btn" data-tip="5">5%</button>
                <button type="button" class="tip-btn" data-tip="10">10%</button>
                <button type="button" class="tip-btn active" data-tip="15">15%</button>
                <button type="button" class="tip-btn" data-tip="20">20%</button>
            </div>

            <label for="custom-tip">Custom Tip (%)</label>
            <input type="number" id="custom-tip" placeholder="Enter custom percentage" min="0" step="any">
        </div>

        <div class="input-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" value="1" min="1" step="1">
        </div>

        <p id="error" class="error" role="alert"></p>

        <div class="results">
            <div class="result-row">
                <span>Total Tip</span>
                <strong id="tip-amount">₹0.00</strong>
            </div>

            <div class="result-row">
                <span>Total Bill</span>
                <strong id="total-bill">₹0.00</strong>
            </div>

            <div class="result-row">
                <span>Tip Per Person</span>
                <strong id="tip-per-person">₹0.00</strong>
            </div>

            <div class="result-row highlight">
                <span>Total Per Person</span>
                <strong id="per-person">₹0.00</strong>
            </div>
        </div>

        <button type="button" id="reset" class="reset-btn">Reset Calculator</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
